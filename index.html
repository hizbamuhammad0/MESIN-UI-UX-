<!DOCTYPE html>
<html lang="en" data-style="tech-glossy" data-accent="cyan">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nessa Kamalika — Growth & Performance Marketing</title>
  <meta name="description" content="Growth & Performance Marketer focused on driving sustainable revenue growth through targeted paid advertising and end-to-end funnel execution. Delivering IDR 600M–800M/month with 3.5x–10.0x ROAS.">
  
  <!-- 🔠 Typography: Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Outfit:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- 🌟 Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- 🎨 Modular Stylesheets -->
  <link rel="stylesheet" href="styles/tokens.css?v=3.5">
  <link rel="stylesheet" href="styles/base.css?v=3.5">
  <link rel="stylesheet" href="styles/components.css?v=3.5">
  <link rel="stylesheet" href="styles/animations.css?v=3.5">
</head>
<body>

  <!-- 🌌 Background Glowing Orbs (Depth & Atmosphere) -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- 🧭 Navbar Slot -->
  <header class="navbar" id="navbar-slot"></header>

  <!-- 🚀 Main Content Sections -->
  <main id="main-content">
    <!-- 1. Hero Section -->
    <section id="hero-slot"></section>

    <!-- Pop Ticker Marquee -->
    <div id="ticker-slot"></div>

    <!-- Key Performance Metrics -->
    <section id="stats-slot"></section>

    <!-- 2. Career History: Experience & Education -->
    <section id="experience-slot"></section>

    <!-- 3. Verified Credentials: Licenses & Certifications -->
    <section id="certifications-slot"></section>

    <!-- 4. Work Showcase: Projects & Portfolio -->
    <section id="portfolio-slot"></section>

    <!-- 5. Core Competencies: Skills & Tools -->
    <section id="skills-slot"></section>

    <!-- 6. Contact & Collaboration -->
    <section id="contact-slot"></section>
  </main>

  <!-- ⚓ Footer -->
  <footer class="footer-section">
    <div class="container">
      <p>© <span id="current-year">2026</span> Nessa Kamalika • Growth & Performance Marketing</p>
      <p class="footer-sub">Engineered with Precision Pop-Tech Design System • Validated Business Deliverables</p>
    </div>
  </footer>

  <!-- 🖼️ Lightbox Modal (Detail Image / Certificate Preview) -->
  <div class="modal-overlay" id="lightbox-modal">
    <div class="modal-card">
      <button class="modal-close-btn" onclick="closeLightbox()" title="Close Preview">✕</button>
      <img id="modal-img" src="" alt="Detail Preview" class="modal-img" />
      <div class="modal-body">
        <h3 id="modal-title" class="modal-title"></h3>
        <p id="modal-desc" class="modal-desc"></p>
        <div id="modal-extra" class="modal-extra"></div>
      </div>
    </div>
  </div>

  <!-- 📦 Data Layer (Single Source of Truth) -->
  <script src="data/profile.js?v=3.5"></script>

  <!-- ⚙️ UI Engine & Interaction Scripts -->
  <script src="scripts/engine.js?v=3.5"></script>
  <script src="scripts/interactions.js?v=3.5"></script>

  <script>
    document.getElementById('current-year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
